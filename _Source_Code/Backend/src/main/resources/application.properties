spring.application.name=smartcity-backend
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartcity}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smartcity}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.municipal.bootstrap-enabled=${MUNICIPAL_BOOTSTRAP_ENABLED:false}
app.municipal.clearance-code=${ADMIN_CLEARANCE_CODE:}
app.seed.enabled=${SEED_DEMO_DATA:true}
app.complaints.resolution-proof-required=${RESOLUTION_PROOF_REQUIRED:true}
springdoc.swagger-ui.path=/swagger-ui.html
